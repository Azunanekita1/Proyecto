<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEDIDO</title>
        <link rel="stylesheet" href="/../predestilo.css">  
     <link rel="stylesheet" href="menu.css">
     <link rel="stylesheet" href="pedido.css">
     <link rel="stylesheet" href="estilo.css">

</head>
<body >
    <!-- Menu princiapal -->
  <div id="pagina" class="sin-slider" > 
  </div>
  
  <!-- Modal con formulario -->
  <div id="modalFormulario" class="modal">
    <div class="modal-contenido">

  <form id="formPedido" method="POST" action="/enviar-pedido">
    <label>Nombre:</label>
    <input type="text" name="nombre" required><br><br>

    <label>Correo:</label>
    <input type="email" name="email" required><br><br>

    <h3>Selecciona tu pedido:</h3>
    <h3>Entradas:</h3>
    <label><input type="checkbox" name="pedido" value="Maiz"> Maiz</label><br>
    <label><input type="checkbox" name="pedido" value="Empanadas"> Empanadas</label><br>
    <label><input type="checkbox" name="pedido" value="Papas Fritas"> Papas fritas</label><br><br>
     <label><input type="checkbox" name="pedido" value="Camaron apanado"> Camaron apanado</label><br>
    <label><input type="checkbox" name="pedido" value="Patacones"> Patacones</label><br>
    <h3>Platos:</h3>
    <label><input type="checkbox" name="pedido" value="Sopa de Camaron"> Sopa de Camaron</label><br><br>
       <label><input type="checkbox" name="pedido" value="Steak"> Steak </label><br>
    <label><input type="checkbox" name="pedido" value="Fideos con Camaron"> Fideos con camaron</label><br>
    <label><input type="checkbox" name="pedido" value="Papas Fritas"> Papas fritas</label><br><br>
     <label><input type="checkbox" name="pedido" value="Ceviche"> Ceviche</label><br>
   <h3>Postres:</h3>
    <label><input type="checkbox" name="pedido" value="Mochi"> Mochi</label><br><br>
       <label><input type="checkbox" name="pedido" value="Merengon"> Merengon </label><br>
    <label><input type="checkbox" name="pedido" value="Postre 3 leches"> Postre 3 leches</label><br>
    <label><input type="checkbox" name="pedido" value="Postre de chocolate"> Postre de chocolate</label><br><br>
     <label><input type="checkbox" name="pedido" value="Tarta de queso"> Tarta de queso.</label><br>

    <button type="submit">Enviar Pedido</button>
  </form>
  <p id="mensajeRespuesta"></p>
 <button id="cerrarModal">Cerrar</button>
 </div>  </div>

   <script>
        document.getElementById("abrirFormulario").onclick = function() {
          document.getElementById("modalFormulario").style.display = "block";
        };
        document.getElementById("cerrarModal").onclick = function() {
          document.getElementById("modalFormulario").style.display = "none";
        };
      </script>
  <script>
    document.getElementById("formPedido").addEventListener("submit", async function(e) {
      e.preventDefault();
      const formData = new FormData(this);
      const data = {};
      formData.forEach((value, key) => {
        if (key === "pedido") {
          if (!data.pedido) data.pedido = [];
          data.pedido.push(value);
        } else {
          data[key] = value;
        }
      });

      const response = await fetch("/enviar-pedido", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      const result = await response.json();
      document.getElementById("mensajeRespuesta").innerText = result.mensaje;
      document.getElementById("mensajeRespuesta").style.color = result.ok ? "green" : "red";
    });
  </script>
  
  <script src="pedido.js"> </script>
  <script src="slides.js"></script>
 <script src="tiempo.js"></script>

</body>
  
</html>
